name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for client folder
        id: client-check
        run: |
          if [ -d "client" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.client-check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        if: steps.client-check.outputs.exists == 'true'
        run: |
          cd client
          npm install

      - name: Run frontend tests
        if: steps.client-check.outputs.exists == 'true'
        run: |
          cd client
          npm run test || echo "No frontend tests found"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd server
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd server
          pytest || echo "No backend tests found"

  docker-backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for backend
        run: |
          cd server
          docker build -t syndata-backend .

      - name: Run Docker container for backend
        run: |
          docker run -d -p 8000:8000 --name syndata-backend-test syndata-backend
          sleep 10  # Wait for the container to start
          curl --fail http://localhost:8000/health

      - name: Stop and remove container
        run: |
          docker stop syndata-backend-test
          docker rm syndata-backend-test